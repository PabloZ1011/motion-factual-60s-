name: Renderizar MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: mkdir -p out && npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: motion-factual-mp4
          path: out/video.mp4
          retention-days: 7
